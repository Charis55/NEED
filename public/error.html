<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>No Connection - NEED</title>
    <style>
        :root {
            --color-brutal-bg: #EAE6D7;
            --color-brutal-yellow: #FFD500;
            --color-brutal-red: #FF3B30;
            --color-brutal-blue: #007AFF;
            --color-brutal-teal: #34C759;
            --color-brutal-pink: #FF2D55;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--color-brutal-bg);
            color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            overflow: hidden;
            background-image: radial-gradient(#000 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .brutal-card {
            background-color: #fff;
            border: 4px solid #000;
            box-shadow: 12px 12px 0 0 #000;
            padding: 40px 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }

        .brutal-badge {
            position: absolute;
            top: -20px;
            left: -20px;
            background-color: var(--color-brutal-red);
            border: 4px solid #000;
            color: #fff;
            padding: 8px 16px;
            font-weight: 900;
            font-size: 1.2rem;
            text-transform: uppercase;
            transform: rotate(-5deg);
            box-shadow: 4px 4px 0 0 #000;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            gap: 0;
        }

        .logo-n-box {
            width: 40px;
            height: 40px;
            border: 4px solid #000;
            background-color: var(--color-brutal-pink);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 4px 4px 0 0 #000;
            position: relative;
            z-index: 10;
        }

        .logo-n-text {
            font-weight: 900;
            color: #fff;
            font-size: 20px;
        }

        .logo-eed {
            font-size: 30px;
            font-weight: 900;
            color: #000;
            line-height: 1;
            letter-spacing: -0.05em;
            margin-left: -8px;
            position: relative;
            z-index: 0;
        }

        h1 {
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 12px;
            line-height: 1.1;
        }

        p {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 32px;
            background-color: var(--color-brutal-yellow);
            padding: 8px;
            border: 2px solid #000;
            display: inline-block;
        }

        .retry-btn {
            background-color: var(--color-brutal-teal);
            border: 4px solid #000;
            color: #000;
            font-weight: 900;
            font-size: 1.25rem;
            text-transform: uppercase;
            padding: 16px 24px;
            width: 100%;
            cursor: pointer;
            box-shadow: 6px 6px 0 0 #000;
            transition: all 0.1s ease;
        }

        .retry-btn:active {
            transform: translate(6px, 6px);
            box-shadow: 0 0 0 0 #000;
        }
    </style>
</head>
<body>
    <div class="brutal-card">
        <div class="brutal-badge">ERROR</div>
        
        <div class="logo-container">
            <img src="/LOGO.png" alt="N" style="width: 44px; height: 44px; border: 4px solid #000; box-shadow: 4px 4px 0 0 #000; z-index: 10; object-fit: contain; background-color: var(--color-brutal-pink);" />
            <span class="logo-eed">EED</span>
        </div>

        <h1>No Internet Connection</h1>
        <p>You seem to be offline.</p>
        
        <button class="retry-btn" onclick="window.location.href = '/'">
            TRY AGAIN
        </button>
    </div>

    <script>
        window.addEventListener('online', function() {
            window.location.href = '/';
        });
    </script>
</body>
</html>
